<!DOCTYPE index. html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rate My Shirt</title>
<style>
:root{--bg:#f3f3ee;--ink:#161616;--green:#1fb554;--card:#fff;--muted:#6b6b66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141714;--ink:#f2f2ee;--card:#fff;--muted:#a3a39c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px;overflow-x:hidden}
h1{font-size:clamp(2rem,8vw,3.2rem);margin:6px 0 4px;text-align:center;letter-spacing:-.02em}
h1 span{color:var(--green)}
.sub{margin:0 0 16px;color:var(--muted);text-align:center;font-size:1.05rem}
.stage{position:relative;width:min(100%,520px);aspect-ratio:720/670;background:var(--card);border-radius:24px;overflow:visible;box-shadow:0 6px 30px rgba(0,0,0,.12)}
.shirt{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:24px;transform-origin:50% 60%;user-select:none;-webkit-user-drag:none}
.tile{position:absolute;will-change:transform,opacity;pointer-events:none}
.flash{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd23f 25%,#ff5a1f 55%,transparent 72%);opacity:0;pointer-events:none;z-index:3}
.fx{position:absolute;pointer-events:none;z-index:4;font-size:28px;will-change:transform,opacity}
.stars{display:flex;gap:6px;margin:22px 0 6px}
.stars button{background:none;border:0;padding:4px;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;cursor:pointer;color:#c9c9c2;transition:transform .12s,color .12s}
.stars button.on{color:#ffb800}
.stars button:hover{transform:scale(1.15)}
.stars button:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:10px}
#msg{min-height:1.6em;font-size:1.2rem;font-weight:700;text-align:center;margin:4px 0}
.stat{color:var(--muted);font-size:.95rem;text-align:center}
#again{margin-top:10px;background:var(--green);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:1.05rem;font-weight:700;cursor:pointer;display:none}
#again:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@keyframes dance{
0%{transform:translate(0,0) rotate(0) scale(1)}
12%{transform:translate(-6%,-8%) rotate(-12deg) scale(1.05)}
25%{transform:translate(6%,0) rotate(10deg) scaleX(.9)}
37%{transform:translate(-4%,-10%) rotate(14deg) scale(1.08)}
50%{transform:translate(0,4%) rotate(0) scale(.92,1.08)}
62%{transform:translate(6%,-8%) rotate(-14deg) scale(1.05)}
75%{transform:translate(-6%,0) rotate(12deg) scaleX(1.1)}
88%{transform:translate(2%,-6%) rotate(-8deg)}
100%{transform:translate(0,0) rotate(0) scale(1)}}
@keyframes wild{
0%,100%{transform:translate(0,0) rotate(0) scale(1)}
10%{transform:translate(-10%,-14%) rotate(-25deg) scale(1.1)}
20%{transform:translate(10%,0) rotate(20deg) scale(.9,1.1)}
30%{transform:translate(0,-18%) rotate(360deg) scale(1.15)}
45%{transform:translate(-12%,2%) rotate(-20deg) scaleX(1.2)}
60%{transform:translate(12%,-12%) rotate(25deg) scale(1.1)}
75%{transform:translate(0,4%) rotate(-10deg) scale(.9,1.1)}
90%{transform:translate(-4%,-8%) rotate(8deg)}}
@keyframes meh{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-5px,3px) rotate(-1deg)}40%{transform:translate(5px,-3px) rotate(1deg)}60%{transform:translate(-6px,-2px)}80%{transform:translate(6px,3px)}100%{transform:translate(0,0)}}
.dance{animation:dance .9s ease-in-out 3}
.wild{animation:wild .75s ease-in-out 5}
.meh{animation:meh .8s ease-in-out 2}
.shake{animation:shake .12s linear 8}
.stage.busy~.stars button{pointer-events:none}
@media (prefers-reduced-motion:reduce){.dance,.wild{animation-duration:1.6s}}
</style>
</head>
<body>
<h1>Rate my <span>shirt</span></h1>
<p class="sub">Tap a star, 1 to 5. Be honest. The shirt has feelings.</p>

  <div class="flash" id="flash"></div>
</div>

<div class="stars" id="stars" role="group" aria-label="Rate the shirt from 1 to 5">
  <button data-v="1" aria-label="1 star">★</button>
  <button data-v="2" aria-label="2 stars">★</button>
  <button data-v="3" aria-label="3 stars">★</button>
  <button data-v="4" aria-label="4 stars">★</button>
  <button data-v="5" aria-label="5 stars">★</button>
</div>
<div id="msg" aria-live="polite"></div>
<div class="stat" id="stat"></div>
<button id="again">Rebuild the shirt</button>

<script>
(function(){
var stage=document.getElementById('stage'),shirt=document.getElementById('shirt'),flash=document.getElementById('flash');
var msg=document.getElementById('msg'),stat=document.getElementById('stat'),again=document.getElementById('again');
var btns=[].slice.call(document.querySelectorAll('#stars button'));
var busy=false,tiles=[];
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var data={sum:0,n:0};
try{var s=localStorage.getItem('shirt-ratings');if(s)data=JSON.parse(s)||data}catch(e){}
function showStat(){stat.textContent=data.n?('Your ratings so far: '+(data.sum/data.n).toFixed(1)+' average from '+data.n+(data.n===1?' vote':' votes')):''}
showStat();
function paint(v){btns.forEach(function(b){b.classList.toggle('on',+b.dataset.v<=v)})}
btns.forEach(function(b){
  b.addEventListener('mouseenter',function(){if(!busy)paint(+b.dataset.v)});
  b.addEventListener('focus',function(){if(!busy)paint(+b.dataset.v)});
  b.addEventListener('click',function(){rate(+b.dataset.v)});
});
document.getElementById('stars').addEventListener('mouseleave',function(){if(!busy)paint(0)});
function save(v){data.sum+=v;data.n++;try{localStorage.setItem('shirt-ratings',JSON.stringify(data))}catch(e){}showStat()}
function rand(a,b){return a+Math.random()*(b-a)}
function sprinkle(list,count,origin){
  var r=stage.getBoundingClientRect();
  for(var i=0;i<count;i++){
    var e=document.createElement('div');e.className='fx';
    e.textContent=list[i%list.length];
    var x=origin?r.width/2:rand(0,r.width),y=origin?r.height/2:r.height*0.9;
    e.style.left=x+'px';e.style.top=y+'px';stage.appendChild(e);
    var dx=origin?rand(-r.width*.8,r.width*.8):rand(-60,60);
    var dy=origin?rand(-r.height*.8,r.height*.6):rand(-r.height*1.1,-r.height*.4);
    var a=e.animate([{transform:'translate(0,0) rotate(0) scale(.6)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+rand(-360,360)+'deg) scale(1.3)',opacity:0}],{duration:rand(900,1700),delay:rand(0,500),easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'});
    a.onfinish=(function(el){return function(){el.remove()}})(e);
  }
}
function explode(big){
  var r=stage.getBoundingClientRect(),W=r.width,H=r.height,cols=9,rows=9,tw=W/cols,th=H/rows;
  var src=shirt.src;
  shirt.style.visibility='hidden';
  for(var i=0;i<rows;i++)for(var j=0;j<cols;j++){
    var t=document.createElement('div');t.className='tile';
    t.style.cssText='width:'+tw+'px;height:'+th+'px;left:'+(j*tw)+'px;top:'+(i*th)+'px;background-image:url('+src+');background-size:'+W+'px '+H+'px;background-position:'+(-j*tw)+'px '+(-i*th)+'px';
    stage.appendChild(t);tiles.push(t);
    var cx=j*tw+tw/2-W/2,cy=i*th+th/2-H/2,d=Math.max(1,Math.hypot(cx,cy)),k=(big?2.4:1.3);
    var dx=cx/d*rand(150,420)*k,dy=cy/d*rand(150,420)*k-rand(0,120);
    t.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+rand(-540,540)+'deg)',opacity:0}],{duration:rand(900,1500),delay:rand(0,120),easing:'cubic-bezier(.1,.8,.3,1)',fill:'forwards'});
  }
  flash.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1)',offset:.25},{opacity:0,transform:'scale(1.6)'}],{duration:700,easing:'ease-out'});
  sprinkle(['💥','🔥','💨','✨'],big?26:12,true);
}
function rebuild(){
  tiles.forEach(function(t){t.remove()});tiles=[];
  shirt.style.visibility='visible';
  shirt.animate([{transform:'scale(.3)',opacity:0},{transform:'scale(1.08)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],{duration:500,easing:'ease-out'});
  again.style.display='none';busy=false;paint(0);msg.textContent='';
}
again.addEventListener('click',rebuild);
function play(cls,ms,done){
  shirt.classList.add(cls);
  setTimeout(function(){shirt.classList.remove(cls);done&&done()},ms);
}
function finish(){busy=false;paint(0)}
function rate(v){
  if(busy)return;
  busy=true;paint(v);save(v);
  if(v<=2){
    msg.textContent=v===1?'Oh no. Everything hurts. 💥':'Ouch. Shirt can’t take it. 💥';
    play('shake',reduce?10:960,function(){
      explode(v===1);
      setTimeout(function(){msg.textContent='The shirt has exploded.';again.style.display='inline-block';busy=true},reduce?10:900);
    });
  }else if(v===3){
    msg.textContent='Meh. The shirt shrugs. 🤷';
    play('meh',1700,finish);
  }else if(v===4){
    msg.textContent='Nice! The shirt is dancing! 🕺';
    sprinkle(['🎵','🎶','✨'],14,false);
    play('dance',2750,function(){msg.textContent='';finish()});
  }else{
    msg.textContent='FIVE STARS! Full dance mode! 🎉🕺';
    sprinkle(['🎉','🎊','🎵','⭐','🎶','💚'],36,false);
    setTimeout(function(){sprinkle(['🎉','🎊','⭐','💚'],24,false)},1800);
    play('wild',3800,function(){msg.textContent='';finish()});
  }
}
})();
</script>
